<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>分析メニュー アンケート</title>
<style>
  :root {
    --bg1: #eef2ff;
    --bg2: #f8fafc;
    --card: #ffffff;
    --border: #e7e9f0;
    --text: #1e2235;
    --muted: #7a8199;
    --accent: #6366f1;
    --accent2: #8b5cf6;
    --ok: #059669;
    --okbg: #d1fae5;
    --pri: #d97706;
    --pribg: #fef3c7;
    --ng: #dc2626;
    --ngbg: #fee2e2;
    --radius: 14px;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Noto Sans JP", "Yu Gothic", sans-serif;
    background: linear-gradient(160deg, var(--bg1), var(--bg2) 40%);
    background-attachment: fixed;
    color: var(--text);
    line-height: 1.65;
    min-height: 100vh;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 0;
    z-index: 20;
    backdrop-filter: blur(12px);
    background: rgba(255,255,255,.85);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px 10px;
  }
  .header-inner {
    max-width: 760px;
    margin: 0 auto;
    display: flex;
    align-items: center;
    gap: 12px;
  }
  header h1 { font-size: 16px; font-weight: 700; letter-spacing: .02em; }
  .progress-wrap { margin-left: auto; text-align: right; }
  .progress-label { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
  .progress-bar {
    margin-top: 4px;
    width: 140px;
    height: 6px;
    border-radius: 99px;
    background: #e5e7f5;
    overflow: hidden;
  }
  .progress-bar > div {
    height: 100%;
    width: 0%;
    border-radius: 99px;
    background: linear-gradient(90deg, var(--accent), var(--accent2));
    transition: width .3s ease;
  }

  main { max-width: 760px; margin: 0 auto; padding: 24px 16px 60px; }

  .intro {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 12px rgba(80,90,180,.06);
    padding: 20px 22px;
    margin-bottom: 28px;
    font-size: 14px;
    color: #4b5069;
  }
  .intro .pills { margin-top: 10px; display: flex; gap: 8px; flex-wrap: wrap; }
  .pill-demo {
    font-size: 12.5px;
    padding: 4px 12px;
    border-radius: 99px;
    font-weight: 600;
  }
  .pill-demo.ok { background: var(--okbg); color: var(--ok); }
  .pill-demo.pri { background: var(--pribg); color: var(--pri); }
  .pill-demo.ng { background: var(--ngbg); color: var(--ng); }
  .intro .privacy { margin-top: 10px; font-size: 12.5px; color: var(--muted); }

  /* ---------- sections ---------- */
  section {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    box-shadow: 0 2px 12px rgba(80,90,180,.06);
    margin-bottom: 22px;
    overflow: hidden;
  }
  .sec-head { padding: 18px 20px 12px; }
  .sec-head h2 { font-size: 15.5px; font-weight: 700; display: flex; align-items: center; gap: 8px; }
  .sec-head h2 .secnum {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    width: 24px; height: 24px;
    border-radius: 8px;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    color: #fff;
    font-size: 12px;
    font-weight: 700;
    flex-shrink: 0;
  }
  .sec-head .note {
    font-size: 12.5px;
    color: var(--muted);
    margin-top: 6px;
    padding: 8px 10px;
    background: #f7f8fc;
    border-radius: 8px;
  }
  .sec-tools { display: flex; gap: 14px; margin-top: 10px; }
  .sec-tools button {
    border: none;
    background: none;
    font-size: 12px;
    color: var(--muted);
    cursor: pointer;
    padding: 2px 0;
    text-decoration: underline;
    text-underline-offset: 3px;
    font-family: inherit;
  }
  .sec-tools button:hover { color: var(--text); }

  .item {
    padding: 12px 20px;
    border-top: 1px solid #f1f2f8;
    transition: background .15s;
  }
  .item .txt { font-size: 14px; margin-bottom: 8px; }
  .item .txt .id {
    display: inline-block;
    color: var(--muted);
    font-size: 11px;
    font-weight: 600;
    margin-right: 8px;
    letter-spacing: .03em;
  }
  .choices { display: flex; gap: 8px; }
  .ch {
    flex: 1;
    max-width: 150px;
    border: 1.5px solid var(--border);
    border-radius: 10px;
    background: #fbfbfe;
    font-size: 13px;
    font-weight: 600;
    color: #5a6079;
    cursor: pointer;
    padding: 8px 0;
    font-family: inherit;
    transition: all .12s;
  }
  .ch:hover { border-color: #c3c7e0; background: #f4f5fb; }
  .ch.sel-ok  { background: var(--okbg);  border-color: var(--ok);  color: var(--ok); }
  .ch.sel-pri { background: var(--pribg); border-color: var(--pri); color: var(--pri); }
  .ch.sel-ng  { background: var(--ngbg);  border-color: var(--ng);  color: var(--ng); }
  .item.marked-ok  { background: #f6fdf9; }
  .item.marked-pri { background: #fffdf5; }
  .item.marked-ng  { background: #fffafa; }

  .comment-box { padding: 14px 20px 18px; border-top: 1px dashed var(--border); background: #fbfbff; }
  .comment-box label { display: block; font-size: 12.5px; font-weight: 600; color: var(--muted); margin-bottom: 6px; }
  .comment-box textarea {
    width: 100%;
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 10px 12px;
    font-size: 14px;
    font-family: inherit;
    resize: vertical;
    min-height: 56px;
    background: #fff;
  }
  .comment-box textarea:focus { outline: 2px solid #c7c9f0; outline-offset: -1px; border-color: var(--accent); }

  /* ---------- submit ---------- */
  .submit-area { text-align: center; padding: 12px 0 20px; }
  #submitBtn {
    width: 100%;
    max-width: 420px;
    border: none;
    border-radius: 14px;
    padding: 17px 0;
    font-size: 17px;
    font-weight: 700;
    color: #fff;
    font-family: inherit;
    cursor: pointer;
    background: linear-gradient(135deg, var(--accent), var(--accent2));
    box-shadow: 0 6px 20px rgba(99,102,241,.35);
    transition: transform .12s, box-shadow .12s, opacity .2s;
  }
  #submitBtn:hover:not(:disabled) { transform: translateY(-1px); box-shadow: 0 8px 24px rgba(99,102,241,.45); }
  #submitBtn:active:not(:disabled) { transform: translateY(0); }
  #submitBtn:disabled { opacity: .55; cursor: default; }
  .submit-note { font-size: 12.5px; color: var(--muted); margin-top: 12px; line-height: 1.7; }

  /* ---------- done view ---------- */
  #done {
    display: none;
    text-align: center;
    padding: 80px 20px;
  }
  #done .check {
    width: 72px; height: 72px;
    margin: 0 auto 20px;
    border-radius: 50%;
    background: var(--okbg);
    color: var(--ok);
    font-size: 34px;
    display: flex; align-items: center; justify-content: center;
  }
  #done h2 { font-size: 20px; margin-bottom: 8px; }
  #done p { font-size: 14px; color: var(--muted); }
  #done .again {
    margin-top: 26px;
    display: inline-block;
    font-size: 13px;
    color: var(--accent);
    cursor: pointer;
    text-decoration: underline;
    text-underline-offset: 3px;
    background: none; border: none; font-family: inherit;
  }

  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(90px);
    background: #1e2235;
    color: #fff;
    padding: 12px 22px;
    border-radius: 10px;
    font-size: 13.5px;
    opacity: 0;
    transition: all .25s;
    pointer-events: none;
    z-index: 30;
    max-width: 90vw;
    text-align: center;
    box-shadow: 0 8px 30px rgba(0,0,0,.25);
  }
  #toast.show { transform: translateX(-50%) translateY(0); opacity: 1; }

  footer { text-align: center; font-size: 11.5px; color: #a3a8bd; padding: 0 0 40px; }

  @media (max-width: 560px) {
    .choices { flex-direction: column; }
    .ch { max-width: none; padding: 10px 0; }
    .progress-bar { width: 100px; }
  }
</style>
</head>
<body>
<header>
  <div class="header-inner">
    <h1>分析メニュー アンケート</h1>
    <div class="progress-wrap">
      <div class="progress-label" id="progress">0 / 51</div>
      <div class="progress-bar"><div id="pbar"></div></div>
    </div>
  </div>
</header>

<main id="formView">
  <div class="intro">
    各項目について、分析に欲しいかどうかを3つから選んでください。
    <div class="pills">
      <span class="pill-demo ok">○ ほしい</span>
      <span class="pill-demo pri">★ 優先してほしい</span>
      <span class="pill-demo ng">× いらない</span>
    </div>
    <div class="privacy">
      選んだボタンをもう一度押すと解除できます。未回答のままでもOKです。<br>
      回答は暗号化されて送信され、管理者だけが内容を確認できます。
    </div>
  </div>

  <div id="sections"></div>

  <div class="submit-area">
    <button id="submitBtn">送信する</button>
    <p class="submit-note" id="submitNote">
      送信ボタンを押すと回答が暗号化されて送信され、完了です。<br>
      回答内容を見られるのは管理者だけです。
    </p>
  </div>
</main>

<div id="done">
  <div class="check">✓</div>
  <h2>送信しました</h2>
  <p>ご協力ありがとうございました。</p>
  <button class="again" id="againBtn">続けて別の回答を送る</button>
</div>

<div id="toast"></div>
<footer>分析メニュー仕分けアンケート</footer>

<script>

      "価格帯ごとに順位・いいね・コメントの傾向を比較する",
      "同じクリエイターの商品同士で、価格・順位・反応を比較する",
      "公開日時が取得できている商品について、公開後の経過日数と順位・反応を比較する",

    note: "プロフィール指標は25アカウント分・各1回の記録のみで、現状はプロフィール指標の増減分析は不可。ランキング履歴は別途あり。",

    note: "313投稿。ほぼ表示回数のみで反復観測が不足。「今伸びている投稿」・いいね率・拡散力・フォロワー増加の分析は現状難しい。",
    items: [
      "収集した投稿の中から、表示回数の多い投稿を探す",
      "投稿者ごとに、収集済み投稿の表示回数の平均・中央値・ばらつきを比較する",
      "同じ投稿者の中で、表示回数が突出した投稿を探す",
      "表示回数の多い投稿を参考候補として抽出し、元投稿を見て内容を比較する",
    ],
  },
  {
    id: "mix",
    title: "SNSと販売先を組み合わせた分析",
    note: "関連先の根拠と、同じ期間の記録がある対象に限る。「同時期に変化した」は確認できるが「その投稿が順位を上げた」とは断定できない。",
    items: [
      "公開リンクでつながるInstagramとXFANS・myfansをまとめて調べる",
      "リールが伸びた時期と、関連する販売先の順位変化を並べて見る",
      "Instagramのフォロワー増加と、XFANSのフォロワー増加を並べて見る",
      "SNSは伸びているが販売先の順位は変わっていない、といった動きの違いを探す",
      "両方に比較可能な記録がある対象から、詳しく調べたい事例を抽出する",
    ],
  },
  {
    id: "na",
    title: "今のデータだけでは分からないこと",
    note: "ここに○を付けると「この分析がしたいので、データ取得方法を検討してほしい」という意味になります。",
    items: [
      "実売上、販売数、有料会員数、利益",
      "SNSから販売ページへのクリック数・購入率",
      "どの投稿から何件購入されたか",
      "リールやXの最適な投稿時間帯、公開直後の伸び",
      "動画の視聴維持率・離脱箇所・視聴者属性",
      "動画内容や演出の網羅的な分析",
      "市場全体のシェアや、未収集の競合を含むランキング",
    ],
  },
];

const MARKS = [
  { key: "ok",  label: "○ ほしい",          cls: "sel-ok",  itemCls: "marked-ok"  },
  { key: "pri", label: "★ 優先してほしい",   cls: "sel-pri", itemCls: "marked-pri" },
  { key: "ng",  label: "× いらない",         cls: "sel-ng",  itemCls: "marked-ng"  },
];

const LS_KEY = "analysis-picker-v2";
const HOOK_URL = "https://webhook.site/0196fd60-419f-4e2c-bc0c-fdca16cecb47";
const PUB_KEY_B64 = "MIIBojANBgkqhkiG9w0BAQEFAAOCAY8AMIIBigKCAYEArkqTdgY64PrMYKsnIZGgCludA+U39/0e/GVWUsOmLCtxxI++/32Y7J4kbYx5Wp6BBhdNEQMl+BdAKWknZlLLJiIMYXI7YEh5NIcU44u3hJrSqj9wI5j7NF0cf7w0EThzLfq1v1WxsXqTYo712d7Qjcd62Ftdr5R/DPgDznQdVq5tmzN2VVtKd7ULmW+N51M2RpJ9T2am9/4HVBumxj5etkkXdvmPz6UXP5gS3RUBh73O3EFqP+ZcVL5ErXo05/7G1LVTWBCwDLxEpe0atvwzXUnszY3NV/pXE0dYb5X+VCpsExQ9Gpsxw/eVf/kOLr3K2XXv1yHaA1fQVFRbUwf2Rg56JdbkDCkdD3X7ze52yAxRvMx6DKOFbZgR5G/KjKPC8VMEqGGQd3POk22eQzK6Ngw2glqH+So1pTY+6gU04Q2h+GJIb7Cp8x+ALUOTVUBiS1WsxgFM2gozXG9ZXA6HGLUafgZVq0YnzSxltyne1Rc3GzeveACv9lMxrqobP871AgMBAAE=";

let state = {};
try { state = JSON.parse(localStorage.getItem(LS_KEY) || "{}"); } catch (e) { state = {}; }

const container = document.getElementById("sections");
const progress = document.getElementById("progress");
const pbar = document.getElementById("pbar");
const toast = document.getElementById("toast");

const ALL_ITEMS = [];
SECTIONS.forEach(sec => sec.items.forEach((t, i) => ALL_ITEMS.push({ sec, id: `${sec.id}${i + 1}`, text: t })));

function save() { localStorage.setItem(LS_KEY, JSON.stringify(state)); }

function updateProgress() {
  const done = ALL_ITEMS.filter(it => state[it.id]).length;
  progress.textContent = `${done} / ${ALL_ITEMS.length}`;
  pbar.style.width = `${(done / ALL_ITEMS.length) * 100}%`;
}

function render() {
  container.innerHTML = "";
  SECTIONS.forEach((sec, si) => {
    const el = document.createElement("section");
    const head = document.createElement("div");
    head.className = "sec-head";
    head.innerHTML = `<h2><span class="secnum">${si + 1}</span>${sec.title}</h2>` +
      (sec.note ? `<div class="note">${sec.note}</div>` : "");
    const tools = document.createElement("div");
    tools.className = "sec-tools";
    [["all-ok", "このカテゴリを全部○"], ["all-ng", "全部×"], ["clear", "選択を解除"]].forEach(([act, lbl]) => {
      const b = document.createElement("button");
      b.textContent = lbl;
      b.onclick = () => bulkSet(sec, act);
      tools.appendChild(b);
    });
    head.appendChild(tools);
    el.appendChild(head);

    sec.items.forEach((text, i) => {
      const id = `${sec.id}${i + 1}`;
      const row = document.createElement("div");
      row.className = "item";
      row.dataset.id = id;
      row.innerHTML = `<div class="txt"><span class="id">${id}</span>${text}</div>`;
      const choices = document.createElement("div");
      choices.className = "choices";
      MARKS.forEach(m => {
        const b = document.createElement("button");
        b.className = "ch";
        b.dataset.mark = m.key;
        b.textContent = m.label;
        b.onclick = () => toggle(id, m.key, row);
        choices.appendChild(b);
      });
      row.appendChild(choices);
      el.appendChild(row);
      applyMark(row, id);
    });

    const cbox = document.createElement("div");
    cbox.className = "comment-box";
    const clabel = document.createElement("label");
    clabel.textContent = "このカテゴリで他に欲しい分析・機能（自由記述・任意）";
    const ta = document.createElement("textarea");
    ta.placeholder = "例：週次で順位の変動を通知してほしい、〇〇の切り口で見たい など";
    ta.value = state["_c_" + sec.id] || "";
    ta.addEventListener("input", () => {
      const v = ta.value;
      if (v) state["_c_" + sec.id] = v;
      else delete state["_c_" + sec.id];
      save();
    });
    cbox.appendChild(clabel);
    cbox.appendChild(ta);
    el.appendChild(cbox);

    container.appendChild(el);
  });
  updateProgress();
}

function applyMark(row, id) {
  const cur = state[id];
  row.classList.remove("marked-ok", "marked-pri", "marked-ng");
  row.querySelectorAll(".ch").forEach(b => {
    b.classList.remove("sel-ok", "sel-pri", "sel-ng");
    const m = MARKS.find(mm => mm.key === b.dataset.mark);
    if (m && m.key === cur) {
      b.classList.add(m.cls);
      row.classList.add(m.itemCls);
    }
  });
}

function toggle(id, mark, row) {
  if (state[id] === mark) delete state[id];
  else state[id] = mark;
  save();
  applyMark(row, id);
  updateProgress();
}

function bulkSet(sec, act) {
  sec.items.forEach((_, i) => {
    const id = `${sec.id}${i + 1}`;
    const row = container.querySelector(`.item[data-id="${id}"]`);
    if (act === "clear") delete state[id];
    else if (act === "all-ok") state[id] = "ok";
    else if (act === "all-ng") state[id] = "ng";
    if (row) applyMark(row, id);
  });
  save();
  updateProgress();
}

function buildResult() {
  const groups = { pri: [], ok: [], ng: [], none: [] };
  ALL_ITEMS.forEach(it => {
    const m = state[it.id];
    const entry = `${it.id} ${it.text}`;
    if (m === "pri") groups.pri.push(entry);
    else if (m === "ok") groups.ok.push(entry);
    else if (m === "ng") groups.ng.push(entry);
    else groups.none.push(it.id);
  });
  const fmt = arr => arr.length ? arr.map(s => "- " + s).join("\n") : "- （なし）";
  const commentLines = SECTIONS
    .filter(sec => (state["_c_" + sec.id] || "").trim())
    .map(sec => `【${sec.title}】\n${state["_c_" + sec.id].trim()}`);
  const lines = [
    "【分析メニュー仕分け結果】",
    `送信日時: ${new Date().toLocaleString("ja-JP")}`,
    "",
    "★ 優先:",
    fmt(groups.pri),
    "",
    "○ ほしい:",
    fmt(groups.ok),
    "",
    "× いらない:",
    fmt(groups.ng),
    "",
    `未回答（どちらでも）: ${groups.none.length ? groups.none.join(", ") : "なし"}`,
  ];
  if (commentLines.length) {
    lines.push("", "自由記述（他にほしい分析・機能）:", commentLines.join("\n\n"));
  }
  return lines.join("\n");
}

/* ---------- encryption ---------- */
function b64enc(buf) {
  let s = "";
  const bytes = new Uint8Array(buf);
  for (let i = 0; i < bytes.length; i++) s += String.fromCharCode(bytes[i]);
  return btoa(s);
}
function b64dec(b64) {
  const s = atob(b64);
  const bytes = new Uint8Array(s.length);
  for (let i = 0; i < s.length; i++) bytes[i] = s.charCodeAt(i);
  return bytes.buffer;
}

async function encryptPayload(plainText) {
  const pubKey = await crypto.subtle.importKey(
    "spki", b64dec(PUB_KEY_B64),
    { name: "RSA-OAEP", hash: "SHA-256" }, false, ["encrypt"]
  );
  const aesKey = await crypto.subtle.generateKey({ name: "AES-GCM", length: 256 }, true, ["encrypt"]);
  const iv = crypto.getRandomValues(new Uint8Array(12));
  const ct = await crypto.subtle.encrypt(
    { name: "AES-GCM", iv }, aesKey, new TextEncoder().encode(plainText)
  );
  const rawAes = await crypto.subtle.exportKey("raw", aesKey);
  const wrapped = await crypto.subtle.encrypt({ name: "RSA-OAEP" }, pubKey, rawAes);
  return btoa(JSON.stringify({
    v: 1,
    k: b64enc(wrapped),
    i: b64enc(iv),
    d: b64enc(ct),
  }));
}

/* ---------- submit ---------- */
function showToast(msg) {
  toast.textContent = msg;
  toast.classList.add("show");
  setTimeout(() => toast.classList.remove("show"), 2600);
}

async function copyToClipboard(text) {
  try {
    await navigator.clipboard.writeText(text);
    return true;
  } catch (e) {
    const ta = document.createElement("textarea");
    ta.value = text;
    document.body.appendChild(ta);
    ta.select();
    try { document.execCommand("copy"); } catch (e2) {}
    ta.remove();
    return true;
  }
}

const submitBtn = document.getElementById("submitBtn");
submitBtn.onclick = async () => {
  const text = buildResult();
  submitBtn.disabled = true;
  submitBtn.textContent = "送信中…";
  let delivered = false;
  try {
    const payload = await encryptPayload(text);
    await fetch(HOOK_URL, {
      method: "POST",
      mode: "no-cors",
      headers: { "Content-Type": "text/plain" },
      body: payload,
    });
    delivered = true;
  } catch (e) {
    delivered = false;
  }
  if (delivered) {
    document.getElementById("formView").style.display = "none";
    document.getElementById("done").style.display = "block";
    window.scrollTo({ top: 0 });
    state = {};
    save();
  } else {
    // 送信に失敗した場合はコピーして手動で渡せるようにする
    await copyToClipboard(text);
    submitBtn.disabled = false;
    submitBtn.textContent = "送信する";
    showToast("送信に失敗しました。結果をコピーしたので、サイトの管理者に直接渡してください");
  }
};

document.getElementById("againBtn").onclick = () => {
  document.getElementById("done").style.display = "none";
  document.getElementById("formView").style.display = "block";
  submitBtn.disabled = false;
  submitBtn.textContent = "送信する";
  render();
  window.scrollTo({ top: 0 });
};

render();
</script>
